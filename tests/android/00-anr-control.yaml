# Controlled retry after the captured ANR, with host build/test workloads stopped.
# Checks existing data and opens/closes an unsaved form; no persisted mutation.
appId: local.dailoop.personal
name: Control ANR without concurrent build workload
---
- stopApp
- launchApp:
    permissions:
      all: deny
- tapOn: "Ver detalle de Lectura Android QA"
- scrollUntilVisible:
    element: "2 registros en esta vista"
    direction: DOWN
- assertVisible: "2 registros en esta vista"
- tapOn: "Inicio"
- tapOn: "＋ Nueva actividad"
- tapOn: "Nombre de la actividad"
- inputText: "GPU control"
- hideKeyboard
- takeScreenshot: 00-modal-control
- tapOn: "Cerrar diálogo"
- tapOn: "Descartar cambios"
- assertVisible: "Ver detalle de Lectura Android QA"
