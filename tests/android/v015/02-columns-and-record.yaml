# Requires exact post-upgrade backup verification first. Adds one intended record.
appId: local.dailoop.personal
name: v015 native columns and independent registration
---
- launchApp:
    permissions:
      all: deny
- extendedWaitUntil:
    visible: "¿Qué quieres registrar?"
    timeout: 30000
- takeScreenshot: 10-native-density-1
- tapOn: "Ajustes"
- tapOn: "2 columnas"
- tapOn: "Inicio"
- assertVisible: "Registrar Actividad QA 002 con nombre largo y emoji repetido"
- takeScreenshot: 11-native-density-2
- tapOn: "Ajustes"
- tapOn: "3 columnas"
- tapOn: "Inicio"
- assertVisible: "Registrar Actividad QA 002 con nombre largo y emoji repetido"
- takeScreenshot: 12-native-density-3
- tapOn: "Ajustes"
- tapOn: "4 columnas"
- tapOn: "Inicio"
- assertVisible: "Registrar PRIVADA QA 001"
- assertVisible: "Registrar Actividad QA 002 con nombre largo y emoji repetido"
- takeScreenshot: 13-native-density-4
- tapOn: "Registrar Actividad QA 002 con nombre largo y emoji repetido"
- assertVisible: ".*Registrado: Actividad QA 002 con nombre largo y emoji repetido.*"
- tapOn: "Ver detalle de Actividad QA 002 con nombre largo y emoji repetido"
- assertVisible: "11 registros vigentes"
- takeScreenshot: 14-native-correct-identity-11-records
- stopApp
- launchApp:
    permissions:
      all: deny
- assertVisible: "Registrar Actividad QA 002 con nombre largo y emoji repetido"
- takeScreenshot: 15-native-density-after-reopen
- tapOn: "Ajustes"
- assertVisible: "4 columnas"
- takeScreenshot: 16-native-preference-after-reopen
